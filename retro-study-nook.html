<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ *
 *  RENDERER / SCENE / CAMERA
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x24100a, 0.035);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.35, 1.72, 4.55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.35, 0.95, 0.55);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 1.2;
controls.maxDistance = 9;
controls.update();

/* ------------------------------------------------------------------ *
 *  PROCEDURAL TEXTURES
 * ------------------------------------------------------------------ */
function cvs(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(canvas, rx=1, ry=1){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function fbm(x,y,seed){ // cheap value noise
  let v=0, a=0.5, f=1;
  for(let i=0;i<5;i++){
    v += a*Math.sin(x*f*1.7+seed*13.1+Math.cos(y*f*2.3+seed*7.7)*2.2);
    a*=0.5; f*=2.03;
  }
  return v;
}

/* --- wood grain (walnut / teak) --- */
function woodTexture({w=1024,h=1024,base='#8a4a21',dark='#4a230e',light='#c07a3c',rings=26,vertical=true}={}){
  const c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const img = g.getImageData(0,0,w,h), d = img.data;
  const cb = new THREE.Color(base), cd = new THREE.Color(dark), cl = new THREE.Color(light);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const u = (vertical? x/w : y/h), v = (vertical? y/h : x/w);
      const warp = fbm(u*6.0, v*1.1, 3.0)*0.055 + fbm(u*22.0, v*3.0, 9.0)*0.012;
      let t = Math.sin((u+warp)*Math.PI*2*rings);
      t = Math.pow(Math.abs(t), 0.55);
      const fibre = (Math.sin(v*900.0 + u*40.0)*0.5+0.5)*0.10 + fbm(u*90, v*260, 1.0)*0.035;
      let m = 0.5 + (t-0.5)*0.9 + fibre - 0.06;
      m = Math.min(1, Math.max(0, m));
      const col = m<0.5 ? cd.clone().lerp(cb, m*2) : cb.clone().lerp(cl, (m-0.5)*2);
      const i = (y*w+x)*4;
      d[i]=col.r*255; d[i+1]=col.g*255; d[i+2]=col.b*255; d[i+3]=255;
    }
  }
  g.putImageData(img,0,0);
  return c;
}

/* --- painted plaster --- */
function plasterTexture(hex='#b8560f'){
  const w=512,h=512,c=cvs(w,h),g=c.getContext('2d');
  g.fillStyle=hex; g.fillRect(0,0,w,h);
  const img=g.getImageData(0,0,w,h), d=img.data;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const n = fbm(x/w*40, y/h*40, 5.0)*6 + (Math.random()-0.5)*7;
    const i=(y*w+x)*4;
    d[i]=Math.min(255,Math.max(0,d[i]+n));
    d[i+1]=Math.min(255,Math.max(0,d[i+1]+n));
    d[i+2]=Math.min(255,Math.max(0,d[i+2]+n));
  }
  g.putImageData(img,0,0);
  return c;
}

/* --- cork --- */
function corkTexture(){
  const w=512,h=512,c=cvs(w,h),g=c.getContext('2d');
  g.fillStyle='#b07a44'; g.fillRect(0,0,w,h);
  for(let i=0;i<26000;i++){
    const x=Math.random()*w, y=Math.random()*h, r=Math.random()*3.2+0.6;
    const l = Math.random();
    g.fillStyle = l<0.45 ? `rgba(140,92,48,${0.25+Math.random()*0.4})`
              : l<0.8  ? `rgba(206,158,104,${0.2+Math.random()*0.35})`
                       : `rgba(96,58,26,${0.25+Math.random()*0.3})`;
    g.beginPath(); g.ellipse(x,y,r,r*(0.5+Math.random()*0.9),Math.random()*6.28,0,6.28); g.fill();
  }
  return c;
}

/* --- wicker weave --- */
function wickerTexture(){
  const w=512,h=512,c=cvs(w,h),g=c.getContext('2d');
  g.fillStyle='#b98d52'; g.fillRect(0,0,w,h);
  const rows=18, cols=26;
  for(let r=0;r<rows;r++){
    for(let i=0;i<cols;i++){
      const x=i*(w/cols), y=r*(h/rows);
      const on = (i+r)%2===0;
      g.save(); g.translate(x+w/cols/2, y+h/rows/2);
      const grad = g.createLinearGradient(0,-h/rows/2,0,h/rows/2);
      if(on){ grad.addColorStop(0,'#d4ab6d'); grad.addColorStop(.5,'#b98d52'); grad.addColorStop(1,'#8a6432'); }
      else  { grad.addColorStop(0,'#9b7440'); grad.addColorStop(.5,'#c49c5e'); grad.addColorStop(1,'#7d5a2c'); }
      g.fillStyle=grad;
      g.beginPath(); g.ellipse(0,0,w/cols*0.55,h/rows*0.42,0,0,6.28); g.fill();
      g.restore();
    }
  }
  return c;
}

/* --- paper / book page --- */
function paperTexture(){
  const w=512,h=512,c=cvs(w,h),g=c.getContext('2d');
  g.fillStyle='#f3e6cf'; g.fillRect(0,0,w,h);
  g.globalAlpha=.5;
  for(let i=0;i<3000;i++){ g.fillStyle=`rgba(${180+Math.random()*50|0},${160+Math.random()*40|0},130,.08)`;
    g.fillRect(Math.random()*w,Math.random()*h,2,1); }
  g.globalAlpha=1;
  // faint text lines
  g.fillStyle='rgba(70,52,36,.42)';
  for(let col=0; col<2; col++){
    for(let l=0;l<30;l++){
      let x = 40 + col*248, y = 52 + l*13.5;
      let ww = 170 - Math.random()*40;
      if(l%7===6) ww *= .5;
      g.fillRect(x,y,ww,1.6);
    }
  }
  return c;
}

const woodWallTex   = tex(woodTexture({base:'#7d3f1b',dark:'#3f1d0a',light:'#b96f34',rings:15}), 1, 1);
const woodWallTex2  = tex(woodTexture({base:'#6a3315',dark:'#331707',light:'#a05f2b',rings:19}), 1, 1);
const deskWoodTex   = tex(woodTexture({base:'#8f4b23',dark:'#4d2410',light:'#cf873f',rings:9, vertical:false}), 1, 1);
const legWoodTex    = tex(woodTexture({base:'#5d2c12',dark:'#2c1206',light:'#8c4c22',rings:5}), 1, 1);
const plasterTex    = tex(plasterTexture('#b0530f'), 2, 2);
const corkTex       = tex(corkTexture(), 1, 1);
const wickerTex     = tex(wickerTexture(), 3, 2);
const paperTex      = tex(paperTexture(), 1, 1);

/* ------------------------------------------------------------------ *
 *  ROOM
 * ------------------------------------------------------------------ */
const ROOM = { h: 2.75, xw: 4.6, zw: 5.2 };

// Floor (dark wood under rug)
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM.xw+2, ROOM.zw+2),
  new THREE.MeshStandardMaterial({ color:0x3a1d0d, roughness:0.82, metalness:0.0 })
);
floor.rotation.x = -Math.PI/2;
floor.position.set(ROOM.xw/2-0.6, 0, ROOM.zw/2-0.6);
floor.receiveShadow = true;
scene.add(floor);

// Ceiling
const ceil = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM.xw+2, ROOM.zw+2),
  new THREE.MeshStandardMaterial({ color:0xd8bfa4, roughness:0.95 })
);
ceil.rotation.x = Math.PI/2;
ceil.position.set(ROOM.xw/2-0.6, ROOM.h, ROOM.zw/2-0.6);
scene.add(ceil);

// LEFT wall — painted terracotta, plane x = 0, facing +x
const paintMat = new THREE.MeshStandardMaterial({ map:plasterTex, color:0xffffff, roughness:0.94, metalness:0 });
const wallL = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.zw, ROOM.h), paintMat);
wallL.rotation.y = Math.PI/2;
wallL.position.set(0, ROOM.h/2, ROOM.zw/2);
wallL.receiveShadow = true;
scene.add(wallL);

// BACK-RIGHT wall — wood panelling, plane z = 0, facing +z, two panels + seam
function panel(w, x, texture, tint){
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, ROOM.h),
    new THREE.MeshStandardMaterial({ map:texture, color:tint, roughness:0.52, metalness:0.06 })
  );
  m.position.set(x, ROOM.h/2, 0);
  m.receiveShadow = true;
  return m;
}
const pA = panel(1.95, 0.975, woodWallTex, 0xffd9b8);
const pB = panel(2.65, 3.275, woodWallTex2, 0xffc9a0);
scene.add(pA, pB);

// seam between panels
const seam = new THREE.Mesh(new THREE.BoxGeometry(0.03, ROOM.h, 0.012),
  new THREE.MeshStandardMaterial({ color:0x2a1206, roughness:0.6 }));
seam.position.set(1.95, ROOM.h/2, 0.007);
scene.add(seam);

// corner shadow strip (soft ambient occlusion in the corner)
const cornerAO = new THREE.Mesh(
  new THREE.PlaneGeometry(0.5, ROOM.h),
  new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.32,
    depthWrite:false, blending:THREE.NormalBlending })
);
cornerAO.position.set(0.25, ROOM.h/2, 0.01);
scene.add(cornerAO);
const cornerAO2 = cornerAO.clone();
cornerAO2.rotation.y = Math.PI/2; cornerAO2.position.set(0.01, ROOM.h/2, 0.25);
scene.add(cornerAO2);

// Baseboards
const baseMat = new THREE.MeshStandardMaterial({ color:0x4d2411, roughness:0.6 });
const bb1 = new THREE.Mesh(new THREE.BoxGeometry(ROOM.xw, 0.11, 0.035), baseMat);
bb1.position.set(ROOM.xw/2, 0.055, 0.018); bb1.castShadow = bb1.receiveShadow = true; scene.add(bb1);
const bb2 = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.11, ROOM.zw), baseMat);
bb2.position.set(0.018, 0.055, ROOM.zw/2); bb2.castShadow = bb2.receiveShadow = true; scene.add(bb2);

/* ------------------------------------------------------------------ *
 *  SHAG RUG
 * ------------------------------------------------------------------ */
const rugGroup = new THREE.Group();
scene.add(rugGroup);
const RUG = { x0:-0.05, x1:4.35, z0:0.15, z1:4.35 };
const rugW = RUG.x1-RUG.x0, rugD = RUG.z1-RUG.z0;

const rugBase = new THREE.Mesh(
  new THREE.BoxGeometry(rugW, 0.035, rugD),
  new THREE.MeshStandardMaterial({ color:0x6b4a12, roughness:1.0 })
);
rugBase.position.set((RUG.x0+RUG.x1)/2, 0.017, (RUG.z0+RUG.z1)/2);
rugBase.receiveShadow = true;
rugGroup.add(rugBase);

const STRANDS = 52000;
const strandGeo = new THREE.CylinderGeometry(0.011, 0.006, 0.085, 4, 1, false);
strandGeo.translate(0, 0.042, 0);
const strandMat = new THREE.MeshStandardMaterial({ roughness:0.98, metalness:0.0, vertexColors:false });
const shag = new THREE.InstancedMesh(strandGeo, strandMat, STRANDS);
shag.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
shag.receiveShadow = true;
const dummy = new THREE.Object3D();
const cA = new THREE.Color(0x8a6410), cB = new THREE.Color(0xd8a52c), cC = new THREE.Color(0x5c3f08);
const colAttr = new Float32Array(STRANDS*3);
for(let i=0;i<STRANDS;i++){
  const x = RUG.x0 + Math.random()*rugW;
  const z = RUG.z0 + Math.random()*rugD;
  // clumping noise -> tufted look
  const n = (fbm(x*3.1, z*3.1, 2.0)*0.5+0.5);
  const hh = 0.72 + n*0.75 + Math.random()*0.35;
  dummy.position.set(x, 0.03, z);
  dummy.rotation.set((Math.random()-0.5)*0.95, Math.random()*6.283, (Math.random()-0.5)*0.95);
  dummy.scale.set(0.85+Math.random()*0.4, hh, 0.85+Math.random()*0.4);
  dummy.updateMatrix();
  shag.setMatrixAt(i, dummy.matrix);
  const t = Math.min(1, Math.max(0, n*0.9 + Math.random()*0.35));
  const col = t<0.35 ? cC.clone().lerp(cA, t/0.35) : cA.clone().lerp(cB, (t-0.35)/0.65);
  colAttr[i*3]=col.r; colAttr[i*3+1]=col.g; colAttr[i*3+2]=col.b;
}
shag.instanceColor = new THREE.InstancedBufferAttribute(colAttr, 3);
rugGroup.add(shag);

/* ------------------------------------------------------------------ *
 *  DESK  (kidney / boomerang top, three splayed arch legs)
 * ------------------------------------------------------------------ */
const desk = new THREE.Group();
desk.position.set(1.72, 0, 0.86);
desk.rotation.y = -0.20;
scene.add(desk);

const DESK_H = 0.755, TOP_T = 0.055;

// --- kidney outline (local x = width, y = depth) ---
function kidneyShape(W=2.55, D=1.02){
  const s = new THREE.Shape();
  const hw = W/2, hd = D/2;
  // back edge (against the wall) — gentle bow
  s.moveTo(-hw*0.92, hd);
  s.bezierCurveTo(-hw*0.45, hd*1.10, hw*0.45, hd*1.06, hw*0.94, hd*0.82);
  // right end cap
  s.bezierCurveTo(hw*1.09, hd*0.55, hw*1.08, -hd*0.62, hw*0.86, -hd*0.86);
  // front edge: right lobe -> concave notch -> left lobe
  s.bezierCurveTo(hw*0.62, -hd*1.06, hw*0.40, -hd*1.02, hw*0.22, -hd*0.66);
  s.bezierCurveTo(hw*0.10, -hd*0.42, -hw*0.02, -hd*0.44, -hw*0.14, -hd*0.72);
  s.bezierCurveTo(-hw*0.30, -hd*1.06, -hw*0.66, -hd*1.14, -hw*0.86, -hd*0.86);
  // left end cap
  s.bezierCurveTo(-hw*1.06, -hd*0.60, -hw*1.07, hd*0.62, -hw*0.92, hd);
  return s;
}
const topShape = kidneyShape();
const topGeo = new THREE.ExtrudeGeometry(topShape, {
  depth: TOP_T*0.62, bevelEnabled:true, bevelThickness:0.016, bevelSize:0.016,
  bevelSegments:5, curveSegments:96
});
topGeo.rotateX(-Math.PI/2);
topGeo.computeVertexNormals();

const topMat = new THREE.MeshPhysicalMaterial({
  map: deskWoodTex, color:0xffb877, roughness:0.24, metalness:0.03,
  clearcoat:0.85, clearcoatRoughness:0.18, sheen:0.3, sheenColor:0xffb060
});
deskWoodTex.repeat.set(0.42,0.42);
const deskTop = new THREE.Mesh(topGeo, topMat);
deskTop.position.y = DESK_H;
deskTop.castShadow = true; deskTop.receiveShadow = true;
desk.add(deskTop);

// darker under-lip / apron following a shrunken kidney
const apronShape = kidneyShape(2.44, 0.94);
const apronGeo = new THREE.ExtrudeGeometry(apronShape, {
  depth:0.155, bevelEnabled:true, bevelThickness:0.012, bevelSize:0.012, bevelSegments:3, curveSegments:80
});
apronGeo.rotateX(-Math.PI/2);
const apronMat = new THREE.MeshStandardMaterial({ map:legWoodTex, color:0xffb489, roughness:0.42, metalness:0.03 });
legWoodTex.repeat.set(0.7,0.7);
const apron = new THREE.Mesh(apronGeo, apronMat);
apron.position.y = DESK_H - 0.006;
apron.castShadow = true; apron.receiveShadow = true;
desk.add(apron);

// drawer fronts (three, along the apron front)
function drawerFront(w, x, z, ry){
  const g = new THREE.Group();
  const face = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.115, 0.022),
    new THREE.MeshStandardMaterial({ map:legWoodTex, color:0xffcaa0, roughness:0.34, metalness:0.04 })
  );
  face.castShadow = true; face.receiveShadow = true;
  g.add(face);
  const gap = new THREE.Mesh(new THREE.BoxGeometry(w+0.012, 0.135, 0.012),
    new THREE.MeshStandardMaterial({ color:0x2a1105, roughness:0.8 }));
  gap.position.z = -0.012; g.add(gap);
  g.position.set(x, DESK_H-0.095, z);
  g.rotation.y = ry;
  return g;
}
desk.add(drawerFront(0.72, -0.72, -0.44, 0.09));
desk.add(drawerFront(0.60, 0.02, -0.31, 0.0));
desk.add(drawerFront(0.70, 0.78, -0.44, -0.09));

// --- leg: tapered plank with an arch cut at the foot ---
function makeLeg(height=DESK_H-0.15, topW=0.20, botW=0.30, thick=0.085){
  const s = new THREE.Shape();
  const ht = topW/2, hb = botW/2;
  s.moveTo(-ht, height);
  s.lineTo(ht, height);
  s.lineTo(hb, 0);
  s.lineTo(hb-0.055, 0);
  // inner arch
  s.bezierCurveTo(hb-0.06, height*0.30, -hb+0.06, height*0.30, -hb+0.055, 0);
  s.lineTo(-hb, 0);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {
    depth:thick, bevelEnabled:true, bevelThickness:0.012, bevelSize:0.012, bevelSegments:3, curveSegments:36
  });
  g.translate(0,0,-thick/2);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    map:legWoodTex, color:0xd9906a, roughness:0.36, metalness:0.05
  }));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
const legPositions = [
  { x:-0.92, z:-0.14, ry: 0.55, tilt: 0.055 },
  { x: 0.06, z:  0.10, ry: 0.0,  tilt: 0.0  },
  { x: 0.96, z: -0.12, ry:-0.55, tilt:-0.055 },
];
for(const L of legPositions){
  const leg = makeLeg();
  leg.position.set(L.x, 0.0, L.z);
  leg.rotation.y = L.ry;
  leg.rotation.z = L.tilt;
  desk.add(leg);
}

/* ------------------------------------------------------------------ *
 *  MUSHROOM LAMP
 * ------------------------------------------------------------------ */
const lamp = new THREE.Group();
lamp.position.set(-0.60, DESK_H+0.03, -0.02);
desk.add(lamp);

const brassMat = new THREE.MeshStandardMaterial({ color:0xe6c07a, roughness:0.28, metalness:0.9 });
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.125,0.028,48), brassMat);
lampBase.position.y = 0.014; lampBase.castShadow = true; lampBase.receiveShadow = true; lamp.add(lampBase);
const lampBase2 = new THREE.Mesh(new THREE.CylinderGeometry(0.088,0.105,0.022,48), brassMat);
lampBase2.position.y = 0.038; lampBase2.castShadow = true; lamp.add(lampBase2);

const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.019,0.30,24), brassMat);
stem.position.y = 0.20; stem.castShadow = true; lamp.add(stem);

// dome shade — glowing
const domeGeo = new THREE.SphereGeometry(0.185, 64, 32, 0, Math.PI*2, 0, Math.PI*0.52);
const shadeMat = new THREE.MeshPhysicalMaterial({
  color:0xffc43a, emissive:0xffb324, emissiveIntensity:2.5,
  roughness:0.35, metalness:0.0, side:THREE.DoubleSide,
  transmission:0.25, thickness:0.4, ior:1.4, clearcoat:0.6
});
const dome = new THREE.Mesh(domeGeo, shadeMat);
dome.position.y = 0.345;
lamp.add(dome);

// rim ring
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.185, 0.006, 12, 64),
  new THREE.MeshStandardMaterial({ color:0xffd873, emissive:0xffa020, emissiveIntensity:1.2, roughness:0.3, metalness:0.5 }));
rim.rotation.x = Math.PI/2; rim.position.y = 0.345; lamp.add(rim);

// hot bulb interior
const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.055, 24, 16),
  new THREE.MeshBasicMaterial({ color:0xfff3c8 }));
bulb.position.y = 0.30; lamp.add(bulb);

// glow disc under the shade
const glowDisc = new THREE.Mesh(new THREE.CircleGeometry(0.19, 48),
  new THREE.MeshBasicMaterial({ color:0xffcf6a, transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false }));

  const curve = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],p[1],p[2]||0)));

  m.castShadow = true;
  return m;
}

function leafShape(len=1, wid=0.32, lobes=7, split=0.30){
  const pts = [];
  const N = 60;
  for(let i=0;i<=N;i++){
    const t = i/N;
    let w = wid * Math.pow(Math.sin(Math.PI*Math.min(0.999,t)), 0.62);
    const scallop = 0.72 + 0.28*Math.abs(Math.cos(t*lobes*Math.PI));
    w *= (1-split) + split*scallop;
    pts.push(new THREE.Vector2(w, t*len));
  }
  const s = new THREE.Shape();
  s.moveTo(0,0);
  pts.forEach(p=>s.lineTo(p.x,p.y));
  for(let i=pts.length-1;i>=0;i--) s.lineTo(-pts[i].x, pts[i].y);
  s.lineTo(0,0);
  return s;
}
function makeLeaf(len, wid, color, lobes=7, split=0.34){
  const g = new THREE.ShapeGeometry(leafShape(len,wid,lobes,split), 22);
  const pos = g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    // cup the leaf + droop along its length
    const z = -Math.pow(Math.abs(x)/wid, 2)*wid*0.55 - Math.pow(y/len,2)*len*0.16;
    pos.setZ(i, z);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color, roughness:0.58, metalness:0.0, side:THREE.DoubleSide,
    sheen:0.5, sheenColor:0x9fd06a
  }));
  m.castShadow = true;
  return m;
}
