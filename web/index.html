<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clover &amp; Co. — studio walkthrough</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0c0b;
            font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#F1EADC}
  /* The DOM layer sits BEHIND the WebGL canvas; the canvas is transparent and
     punches a screen-shaped hole in itself so this shows through. */
  #css3d{position:fixed;inset:0;z-index:0}
  #gl{position:fixed;inset:0;z-index:1}
  #gl.passthrough{pointer-events:none}
  #hud{position:fixed;z-index:3;left:16px;bottom:16px;max-width:330px;
       background:rgba(16,18,24,.82);backdrop-filter:blur(8px);
       border:1px solid rgba(241,234,220,.16);border-radius:10px;padding:12px 14px}
  #hud h1{margin:0 0 4px;font-size:13px;letter-spacing:.3px}
  #hud p{margin:0;font-size:11.5px;color:#b9b3a6}
  kbd{background:#2a2d36;border:1px solid #444;border-bottom-width:2px;border-radius:4px;
      padding:1px 5px;font:11px ui-monospace,monospace;color:#F1EADC}
  #mode{position:fixed;z-index:3;right:16px;bottom:16px;display:flex;gap:8px}
  button.m{background:rgba(16,18,24,.82);color:#F1EADC;border:1px solid rgba(241,234,220,.18);
           border-radius:8px;padding:8px 13px;font-size:12px;cursor:pointer}
  button.m:hover{border-color:#EFB01F;color:#EFB01F}
  button.m[data-on="1"]{background:#EFB01F;color:#1E2F56;border-color:#EFB01F;font-weight:700}
  #load{position:fixed;inset:0;z-index:9;display:grid;place-content:center;gap:14px;
        background:#0d0c0b;text-align:center;transition:opacity .5s}
  #bar{width:230px;height:3px;background:#2a2721;border-radius:2px;overflow:hidden}
  #barf{height:100%;width:0;background:#EFB01F;transition:width .25s}
  #stat{position:fixed;z-index:3;left:16px;top:16px;font:11px ui-monospace,monospace;
        color:#7d776c;background:rgba(16,18,24,.7);padding:6px 9px;border-radius:6px;white-space:pre}
</style></head><body>
<div id="css3d"></div>
<div id="load"><div style="font-size:15px;letter-spacing:.4px">CLOVER &amp; CO.</div>
  <div id="bar"><div id="barf"></div></div>
  <div style="font-size:11px;color:#7d776c" id="lmsg">loading studio…</div></div>
<div id="stat"></div>
<div id="hud">
  <h1>Studio walkthrough</h1>
  <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · drag to look · <kbd>Shift</kbd> run.
     Walk up to the monitor and press <kbd>E</kbd> — the screen is a real, live web page.</p>
</div>
<div id="mode">
  <button class="m" id="btn-screen">Use the computer <kbd>E</kbd></button>
  <button class="m" id="btn-hole" data-on="1">Hole punch</button>
</div>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
} }
</script>
<script type="module" src="./main.js"></script>
</body></html>
